[project]
name = "swgoh-agent"
version = "0.2.0"
description = "A chat agent for Star Wars: Galaxy of Heroes, grounded in game data from swgoh.gg"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "curl-cffi>=0.7",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "langchain-chroma>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tqdm>=4.66",
    "uvicorn>=0.30",
]

[project.scripts]
swgoh-agent = "swgoh_agent.cli:cli"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swgoh_agent"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
